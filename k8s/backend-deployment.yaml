apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-backend
  namespace: taskflow

spec:
  replicas: 3

  selector:
    matchLabels:
      app: taskflow-backend

  template:
    metadata:
      labels:
        app: taskflow-backend

    spec:
      containers:
        - name: backend

          image: 704348946409.dkr.ecr.ap-south-1.amazonaws.com/taskflow-backend:b20866ee3c1d3a4003e4e92a9ae159272630a4f4

          ports:
            - containerPort: 5000

          env:
            - name: MYSQL_HOST
              value: "taskflow-mysql.cnymkm6eulmf.ap-south-1.rds.amazonaws.com"

            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-secret
                  key: MYSQL_USER

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-secret
                  key: MYSQL_PASSWORD

            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: taskflow-db-secret
                  key: MYSQL_DATABASE

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
