apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-frontend
  namespace: taskflow

spec:
  replicas: 2

  selector:
    matchLabels:
      app: taskflow-frontend

  template:
    metadata:
      labels:
        app: taskflow-frontend

    spec:
      containers:
        - name: frontend
          image: 704348946409.dkr.ecr.ap-south-1.amazonaws.com/taskflow-frontend:9471ba2816420d00e5f16caa4647a77288634865

          ports:
            - containerPort: 80
